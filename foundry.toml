[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./broadcast" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
bot_testnet = "https://rpc.bohr.life"
bot_mainnet = "https://rpc.botchain.ai"

# Do not add [etherscan] with chain = 968. Foundry's built-in chain
# enum does not include BOT testnet and will fail with "Chain 968 not supported".
